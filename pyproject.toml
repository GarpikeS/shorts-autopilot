[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-autopilot"
version = "0.1.0"
description = "Portable, novelty-gated pipeline for generating and validating vertical Shorts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GarpikeS" }]
dependencies = [
  "edge-tts>=7.0.0",
  "Pillow>=10.4.0",
  "playwright>=1.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
shorts-autopilot = "shorts_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
